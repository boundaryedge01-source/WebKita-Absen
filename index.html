<style>
:root{--navy:#0a2463;--blue:#1677ff;--blue2:#0b5ed7;--bg:#f3f6fc;--card:#fff;--text:#0f1b3d;--mut:#6b7794;--line:#e3e9f4;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:14px;--sh:0 4px 18px rgba(10,36,99,.07)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
h2,h3{margin:0 0 6px}h2{font-size:22px}h3{font-size:16px}
p{margin:0 0 8px}.mut{color:var(--mut)}.small{font-size:12.5px}.right{text-align:right}.grow{flex:1}
.row{display:flex;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{gap:10px}.col{display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
.btn{border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:10px 16px;border-radius:11px;font-weight:600;box-shadow:0 3px 10px rgba(22,119,255,.28);transition:.15s}@media (hover:hover){.btn:hover{filter:brightness(1.07)}}.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--blue2);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 3px 10px rgba(220,38,38,.25)}
.btn.green{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 3px 10px rgba(22,163,74,.25)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{border:0;background:transparent;font-size:19px;padding:6px 9px;border-radius:10px;position:relative}@media (hover:hover){.icon:hover{background:#eaf1ff}}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit;color:var(--text);outline:none}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,255,.15)}
.in.sm{width:90px}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:12px;color:#33405f}
label.f .in{margin-top:5px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.stats{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat .l{color:var(--mut);font-size:13px;display:flex;justify-content:space-between}
.stat .v{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.stat.hl{background:linear-gradient(135deg,#0a2463,#0b5ed7);color:#fff;border:0}.stat.hl .l{color:#cfe0ff}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.chartbox{position:relative;height:270px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#f0f5ff;text-align:left;padding:9px 11px;white-space:nowrap;color:#33405f;position:sticky;top:0}
td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:middle}@media (hover:hover){tr:hover td{background:#fafcff}}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#991b1b}.b-info{background:#dbeafe;color:#1e40af}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.toolbar label{font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--sh);transition:.15s;color:var(--text)}@media (hover:hover){.tile:hover{border-color:var(--blue);transform:translateY(-2px)}}
.tile:active{transform:scale(.96);background:#eaf3ff}
.tile.off{opacity:.45;cursor:not-allowed}
.tile.flash{animation:fl .5s}@keyframes fl{0%{background:#bbf7d0}100%{background:#fff}}
.tn{font-weight:700;margin-bottom:4px}.tp{font-size:18px;font-weight:800;color:var(--blue2)}.tm{font-size:12px;color:var(--mut);margin:2px 0}.ts{font-size:12px;font-weight:600;color:var(--ok)}.ts.low{color:var(--warn)}.ts.zero{color:var(--bad)}
.empty{text-align:center;padding:34px 10px;color:var(--mut)}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:255px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:60;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand .w{color:var(--navy)}.brand .k{color:var(--blue)}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav button{width:100%;display:flex;gap:11px;align-items:center;border:0;background:transparent;padding:10px 12px;border-radius:11px;color:#33405f;font-weight:600;text-align:left;margin-bottom:2px}@media (hover:hover){.nav button:hover{background:#eef4ff}}.nav button.on{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 3px 10px rgba(22,119,255,.25)}
.nav .lk{margin-left:auto;font-size:12px}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);padding:12px 12px 4px}
.content{margin-left:255px;flex:1;min-width:0}
.top{position:sticky;top:0;z-index:40;background:rgba(243,246,252,.9);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line)}
.top .ttl{font-weight:800;font-size:17px}
.ham{display:none}
#main{padding:20px;max-width:1280px}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:var(--blue2);color:#fff;font-weight:800;overflow:hidden;padding:0;box-shadow:0 0 0 1.5px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
#bellN{position:absolute;top:0;right:0;background:#ef4444;color:#fff;border-radius:99px;font-size:10.5px;padding:1px 5px;min-width:17px;font-style:normal}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#dbeafe;color:#1e40af;white-space:nowrap}
.chip.bad{background:#fee2e2;color:#991b1b}
.backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:55}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none}.backdrop.open{display:block}.content{margin-left:0}.ham{display:inline-block}#main{padding:14px}.top{padding:8px 12px}}
/* auth */
.authwrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.hero{background:linear-gradient(150deg,#0a2463,#0b5ed7 60%,#35a1ff);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:34px;line-height:1.15;margin:18px 0 12px;letter-spacing:-.8px}
.hero li{margin:8px 0}
.authbox{display:flex;align-items:center;justify-content:center;padding:26px}
.authbox .card{width:100%;max-width:430px;padding:26px}
.tabs{display:flex;background:#eef3fc;border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--blue2);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.err{background:#fee2e2;color:#991b1b;padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.gbtn{display:flex;gap:9px;justify-content:center;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;font-weight:600}
@media(max-width:860px){.authwrap{grid-template-columns:1fr}.hero{padding:26px}.hero h1{font-size:25px}}
/* modal / toast */
.mback{position:fixed;inset:0;background:rgba(10,20,50,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:640px}
.rcpt{background:#fff;border:1px dashed #94a3b8;padding:10px;font:12px/1.3 "Courier New",monospace;white-space:pre;overflow:auto;max-height:200px;margin:8px 0}.scanbox{text-align:center;padding:10px 0}tr.grp td{background:#f1f5f9}.chk{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);padding:5px 10px;border-radius:99px;background:#fff;font-size:13px}.kbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-bottom:10px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.mb{padding:18px}.mb .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100vw - 24px);pointer-events:none}
.toast{background:#0a2463;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;animation:ti .25s;max-width:480px}
.toast.bad{background:#b91c1c}.toast.ok{background:#15803d}
@keyframes ti{from{opacity:0;transform:translateY(10px)}}
/* notif */
.nt{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.nt:last-child{border:0}.nt.unread{background:#f3f8ff}
.nt .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:#eaf1ff}
.nt.t-bad .ic{background:#fee2e2}.nt.t-warn .ic{background:#fef3c7}.nt.t-ok .ic{background:#dcfce7}
.nt .dot{position:absolute;right:12px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:#fff;padding:6px 13px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mut)}
.chips button.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.plan{border:2px solid var(--line);border-radius:18px;padding:20px;background:#fff;position:relative}
.plan.best{border-color:var(--blue)}.plan .tag{position:absolute;top:-12px;right:16px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px}
.plan .pr{font-size:28px;font-weight:800;margin:6px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:2px;color:var(--navy);background:#eaf1ff;padding:8px 14px;border-radius:11px;display:inline-block}
.linkbox{display:flex;gap:8px}.linkbox .in{font-family:ui-monospace,monospace;font-size:13px}
.ph{width:92px;height:92px;border-radius:50%;background:var(--blue2);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.locked{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 14px;border-radius:12px;margin-bottom:14px}
/* tour */
.tblock{position:fixed;inset:0;z-index:2000;pointer-events:none}
.thole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,20,60,.64);pointer-events:none;z-index:2001;transition:all .28s;outline:3px solid rgba(255,255,255,.9)}
.tpop{position:fixed;z-index:2002;width:min(350px,calc(100vw - 24px));background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.4);animation:ti .25s}
.tpop h4{margin:0 0 6px;font-size:17px;color:var(--navy)}.tpop p{color:#445}
.tdots{display:flex;gap:4px;margin:10px 0}.tdots i{height:5px;flex:1;border-radius:9px;background:#dbe5f6}.tdots i.on{background:var(--blue)}
.spin{width:38px;height:38px;border:4px solid #dbe5f6;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
#report{background:#fff;padding:18px;border:1px solid var(--line);border-radius:12px}
@media print{.side,.top{display:none}.content{margin:0}}
/* ===== TEMA BARU: gelap elegan (glass + mauve) ===== */
:root{--navy:#eef4ff;--blue:#4da3ff;--blue2:#1677ff;--bg:#060a14;--card:rgba(255,255,255,.045);--text:#eef3fb;--mut:#93a3c0;--line:rgba(255,255,255,.09);--ok:#4ade80;--warn:#fbbf24;--bad:#fb7185;--r:20px;--sh:none;--acc1:#5eb0ff;--acc2:#0b5ed7;--surf:#0e1424;--surf2:#121a2e}
html{color-scheme:dark}
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);letter-spacing:.005em;
  background-image:radial-gradient(900px 520px at 78% -8%,rgba(22,119,255,.28),transparent 60%),radial-gradient(700px 480px at -8% 108%,rgba(11,94,215,.30),transparent 60%);background-attachment:fixed}
h2,h3{font-weight:700;letter-spacing:-.01em}
::selection{background:rgba(77,163,255,.35)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:.38em;flex:none}
.ic:only-child{margin-right:0}
.stat .l .ic,.nt .ic.ic{margin-right:0}.stat .l>span:last-child .ic{width:1.3em;height:1.3em;opacity:.8}
/* tombol: pill */
.btn{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#ffffff;border-radius:999px;padding:10px 20px;font-weight:700;box-shadow:0 6px 20px rgba(22,119,255,.28),inset 0 1px 0 rgba(255,255,255,.35);display:inline-flex;align-items:center;justify-content:center;gap:2px}@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);box-shadow:none;backdrop-filter:blur(8px)}@media (hover:hover){.btn.ghost:hover{background:rgba(255,255,255,.1)}}
.btn.red{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 6px 18px rgba(225,29,72,.28)}
.btn.green{background:linear-gradient(135deg,#6ee7a8,#22a06b);color:#06231a;box-shadow:0 6px 18px rgba(34,160,107,.25)}
.btn.sm{padding:6px 14px;border-radius:999px}
.icon{color:var(--text);border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);width:40px;height:40px;display:inline-grid;place-items:center;padding:0}@media (hover:hover){.icon:hover{background:rgba(255,255,255,.12)}}
.mh .icon{width:34px;height:34px}
/* input */
.in{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:10px 14px}
.in::placeholder{color:#6b7c9c}
.in:focus{border-color:var(--acc1);box-shadow:0 0 0 3px rgba(77,163,255,.18)}
select.in option{background:#0e1424;color:var(--text)}
input[type=checkbox],input[type=radio]{accent-color:#4da3ff}
input[type=date],input[type=time],input[type=month]{color-scheme:dark}
label.f{color:#c3d0e6}
/* kartu */
.card,.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.stat{padding:16px 18px}.stat .l{color:var(--mut);font-weight:600}
.stat .v{font-size:23px;font-weight:800}
.stat.hl{background:linear-gradient(135deg,rgba(94,176,255,.34),rgba(169,115,154,.2) 60%,rgba(255,255,255,.04));border:1px solid rgba(94,176,255,.35);color:var(--text)}.stat.hl .l{color:#d3e6ff}
.pill{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;color:var(--text)}
/* tabel */
.tw{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px}
th{background:rgba(255,255,255,.05);color:#c3d0e6;font-weight:700;text-transform:none;font-size:12.5px;letter-spacing:.02em}
td{border-top:1px solid var(--line)}@media (hover:hover){tr:hover td{background:rgba(255,255,255,.035)}}

/* ===== TEMA v2: gaya aplikasi trading modern (datar, tegas, banyak gerak halus) ===== */
:root{--bg:#070a12;--card:#0d1320;--line:rgba(255,255,255,.07);--r:16px;--acc1:#2f86ff;--acc2:#1677ff;--surf:#0d1320;--mut:#8c9ab5}
body{background:#070a12;background-image:radial-gradient(800px 420px at 85% -10%,rgba(22,119,255,.16),transparent 60%);background-attachment:fixed}
.card,.stat{background:#0d1320;backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);border-radius:16px;box-shadow:none}
.stat{padding:14px 16px;transition:transform .2s,border-color .2s}@media (hover:hover){.stat:hover{transform:translateY(-2px);border-color:rgba(94,176,255,.35)}}
.stat .l{font-size:12.5px;font-weight:600;color:var(--mut)}.stat .l>span:last-child{width:30px;height:30px;border-radius:10px;background:rgba(22,119,255,.12);color:#7db9ff;display:inline-grid;place-items:center}
.stat .l>span:last-child .ic{width:1.05em;height:1.05em;margin:0;opacity:1}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.stat.hl{background:#0d1320;border:1px solid var(--line)}
.tw{background:#0d1320;border-radius:16px}
th{background:transparent;color:var(--mut);font-weight:600;font-size:12px;border-bottom:1px solid var(--line)}
/* tombol: solid, sudut 12px, bergerak halus */
.btn,.btn.ghost,.btn.green,.btn.red,.icon,.chips button,.tile,.qa,.bnav button,.nav button,.tabs button{transition:transform .15s cubic-bezier(.3,.7,.4,1.4),background .2s,box-shadow .25s,border-color .2s,filter .2s}
.btn{background:#1677ff;color:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(22,119,255,.28);padding:10px 20px;font-weight:700}@media (hover:hover){.btn:hover{background:#3490ff;transform:translateY(-1px);filter:none;box-shadow:0 10px 24px rgba(22,119,255,.36)}}
.btn:active,.qa:active,.bnav button:active,.tile:active,.icon:active,.chips button:active{transform:scale(.95)}
.btn:active{transform:scale(.96);box-shadow:0 2px 8px rgba(22,119,255,.3)}
.btn.ghost{background:#131b2c;border:1px solid var(--line);color:var(--text);box-shadow:none}@media (hover:hover){.btn.ghost:hover{background:#19233a;border-color:rgba(94,176,255,.35)}}
.btn.green{background:#16a870;box-shadow:0 6px 18px rgba(22,168,112,.25);color:#fff}@media (hover:hover){.btn.green:hover{background:#1bc083}}
.btn.red{background:#e5484d;box-shadow:0 6px 18px rgba(229,72,77,.25)}
.btn.sm{border-radius:10px;padding:6px 13px}
.icon{border-radius:12px;background:#131b2c}
.in{background:#0a101c;border-radius:12px;border:1px solid var(--line)}
.in:focus{border-color:#2f86ff;box-shadow:0 0 0 3px rgba(47,134,255,.18)}
.tabs{border-radius:12px;background:#0a101c}.tabs button{border-radius:10px}.tabs button.on{background:#1677ff;box-shadow:none}
/* tab teks bergaris bawah */
.chips{gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{background:transparent;border:0;border-radius:0;padding:10px 14px;color:var(--mut);font-weight:700;position:relative;white-space:nowrap}
.chips button::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px;background:#2f86ff;transform:scaleX(0);transition:transform .25s}
.chips button.on{background:transparent;color:#fff}.chips button.on::after{transform:scaleX(1)}@media (hover:hover){.chips button:hover{background:transparent;color:#fff}}
/* sidebar */
.nav button{border-radius:12px;padding:10px 14px;color:#a9b6cf}
.nav button.on{background:rgba(22,119,255,.16);color:#7db9ff;box-shadow:none}@media (hover:hover){.nav button:hover{background:rgba(255,255,255,.05);transform:translateX(2px)}}@media (hover:hover){.nav button.on:hover{transform:none}}
.nav button.on::before{content:"";position:absolute;left:-10px;width:4px;height:22px;border-radius:0 4px 4px 0;background:#2f86ff}.nav button{position:relative}
.side{background:#080c16;backdrop-filter:none}
.top{background:rgba(7,10,18,.8)}
.avatar{background:linear-gradient(135deg,#2f86ff,#0b4fb8);color:#fff}
.chip{border-radius:999px;background:rgba(22,119,255,.14);color:#8cc3ff;border:1px solid rgba(94,176,255,.25)}
.tile{border-radius:16px;background:#0d1320}@media (hover:hover){.tile:hover{transform:translateY(-3px);background:#111a2c;border-color:rgba(94,176,255,.5)}}
.tp{color:#5eb0ff}
.modal{background:#0d1320;border-radius:22px}.mh{background:#0d1320}
.toast{background:#141d30;border-radius:14px}
/* ===== Hero saldo ===== */
.hero2{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;margin-bottom:14px;background:linear-gradient(135deg,#0d3a8a 0%,#0f2556 55%,#0b1530 100%);border:1px solid rgba(94,176,255,.25)}
.hero2::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(94,176,255,.45),transparent 65%)}
.hero2::after{content:"";position:absolute;left:-40px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(47,134,255,.28),transparent 65%)}
.hero2>*{position:relative;z-index:1}
.h2l{font-size:13px;color:#b9d3ff;font-weight:600}
.h2v{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.h2sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:#c9dcff}
.h2sub .pillx{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 11px;font-weight:700}
.h2act{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.h2act .btn{background:#fff;color:#0b3a8a;box-shadow:none;padding:9px 18px}@media (hover:hover){.h2act .btn:hover{background:#eaf2ff}}
.h2act .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2)}@media (hover:hover){.h2act .btn.ghost:hover{background:rgba(255,255,255,.22)}}
/* ===== Banner geser ===== */
.bn{margin:0 -14px 14px;position:relative}
.bn-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:0 14px;scrollbar-width:none;position:relative;-webkit-overflow-scrolling:touch;cursor:grab}
.bn-track::-webkit-scrollbar{display:none}.bn-track.drag{scroll-snap-type:none;scroll-behavior:auto;cursor:grabbing;user-select:none}
.bn-s{flex:0 0 88%;max-width:560px;scroll-snap-align:center;position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.1);transition:transform .25s}
.bn-s:active{transform:scale(.98)}
.bn-s b{display:block;font-size:17px;line-height:1.25;font-weight:800;letter-spacing:-.01em;max-width:78%}
.bn-s p{margin:6px 0 0;font-size:12.5px;opacity:.85;max-width:72%;line-height:1.4}
.bn-s .cta{align-self:flex-start;margin-top:12px;background:#fff;color:#0b2a66;border-radius:999px;padding:6px 14px;font-weight:800;font-size:12.5px}
.bn-s .art{position:absolute;right:-6px;bottom:-14px;opacity:.28;pointer-events:none}.bn-s .art .ic{width:112px;height:112px;stroke-width:1.1;margin:0}
.bn-s::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.bn-s.s1{background:linear-gradient(135deg,#1677ff,#0b3a8a)}.bn-s.s2{background:linear-gradient(135deg,#6a5af9,#2a2a7a)}.bn-s.s3{background:linear-gradient(135deg,#06a3c4,#0b3f63)}.bn-s.s4{background:linear-gradient(135deg,#12b27a,#0a4a3a)}
.bn-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.bn-dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.2);transition:width .3s,background .3s;cursor:pointer}.bn-dots i.on{width:20px;background:#2f86ff}
/* ===== Menu cepat ===== */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;margin-bottom:16px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;background:transparent;border:0;color:var(--text);font-size:12px;font-weight:600;padding:8px 2px;border-radius:14px;cursor:pointer}
.qa .qi{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#111a2c;border:1px solid var(--line);color:#7db9ff;transition:transform .2s,background .2s}
.qa .qi .ic{width:22px;height:22px;margin:0}@media (hover:hover){.qa:hover .qi{background:rgba(22,119,255,.18);transform:translateY(-3px)}}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}.sechead h3{margin:0;font-size:16px}
/* ===== Bottom bar (HP) ===== */
.bnav{display:none}
@media(max-width:900px){
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(9,13,24,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end}
  .bnav button{flex:1;background:transparent;border:0;color:#7c8aa6;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:6px 0;position:relative}
  .bnav button .ic{width:23px;height:23px;margin:0}.bnav button.on{color:#5eb0ff}
  .bnav button.on::before{content:"";position:absolute;top:-7px;width:24px;height:3px;border-radius:3px;background:#2f86ff}
  .bnav button.mid{margin-top:-22px}.bnav button.mid .fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#3b95ff,#0b5ed7);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(22,119,255,.5);border:4px solid #070a12}.bnav button.mid .fab .ic{width:24px;height:24px}.bnav button.mid.on::before{display:none}
  #main{padding-bottom:96px}.ham{display:none!important}
  #toasts{bottom:92px}#pwaInstall{bottom:92px!important}
  .mback{align-items:flex-end;padding:0}.modal{max-width:none;border-radius:24px 24px 0 0;max-height:90vh;animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
  .h2v{font-size:30px}.stats{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:901px){.bn{margin:0 0 14px}.bn-track{padding:0}.bn-s{flex-basis:calc(33.333% - 8px);max-width:none}.qgrid{grid-template-columns:repeat(8,1fr)}}
/* ===== Gerak ===== */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes ti{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
#main.enter>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
#main.enter>*:nth-child(2){animation-delay:.05s}#main.enter>*:nth-child(3){animation-delay:.1s}#main.enter>*:nth-child(4){animation-delay:.15s}#main.enter>*:nth-child(5){animation-delay:.2s}#main.enter>*:nth-child(6){animation-delay:.25s}#main.enter>*:nth-child(n+7){animation-delay:.3s}
.mback{animation:fade .2s}@media(min-width:901px){.modal{animation:pop .25s cubic-bezier(.2,.8,.2,1)}}
.tile.flash{animation:fl3 .6s}@keyframes fl3{0%{background:rgba(74,222,128,.4);transform:scale(.96)}100%{background:#0d1320;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.refbn{display:flex;gap:10px;align-items:center;background:rgba(22,168,112,.12);border:1px solid rgba(74,222,128,.35);color:#86efac;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600}
.icon.ham{display:none!important}.bn-s p{margin-bottom:2px}

.cartbar{position:sticky;bottom:14px;z-index:30;width:100%;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cartbar .go{opacity:.9}
@media(max-width:900px){.cartbar{bottom:calc(76px + env(safe-area-inset-bottom))}}
.citem{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.citem .grow{flex:1 1 150px;min-width:0}.citem .right{flex:none}
.qtyc{display:flex;align-items:center;gap:4px;flex:none}.qtyc .cq{width:56px!important;flex:none;text-align:center;padding:8px 4px}.qtyc .btn{width:38px;padding:8px 0}
.csum{display:flex;flex-direction:column;gap:6px;margin:10px 0;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.lr{display:flex;justify-content:space-between;gap:10px}.lr.big{font-size:20px;font-weight:800}
.okbox{text-align:center;display:flex;flex-direction:column;gap:6px;padding:8px 0}.bigtot{font-size:32px;font-weight:800;margin:4px 0}
.okbox .lr{justify-content:space-between;max-width:320px;width:100%;margin:0 auto}

/* ===== Splash / intro ===== */
:root{--wks-logo:url("/icons/splash-logo.png")}
.wks-ov{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;text-align:center;padding:24px;overflow:hidden;animation:wks-in .35s ease both;transition:opacity .45s;cursor:pointer}
.wks-ov.out{opacity:0;pointer-events:none}
.wks-glow{position:absolute;width:75vmin;height:75vmin;border-radius:50%;background:radial-gradient(circle,rgba(26,124,245,.17),transparent 65%);animation:wks-in 1.6s .3s both}
.wks-bar{margin-top:5vmin;width:min(30vmin,200px);height:4px;border-radius:4px;background:#dbe7fb;overflow:hidden}
.wks-bar i{display:block;height:100%;background:linear-gradient(90deg,#0b3a8a,#3aa0ff);transform:translateX(-100%);animation:wks-load 1.3s 3.2s ease-in-out forwards}
.wks-logo{position:relative;width:min(78vw,520px)}
.wks-in{position:absolute;aspect-ratio:1}
.wks-pc{position:absolute;inset:0;background:var(--wks-logo) center/100% 100% no-repeat;animation-fill-mode:both}
.wks-base{transform-origin:50% 37%;animation:wks-pop .9s var(--d,.2s) cubic-bezier(.2,.9,.25,1.2) both}
.wks-rw{position:absolute;inset:0}
.wks-rc{transform-origin:70% 24%;animation:wks-rise .9s var(--d,1.2s) cubic-bezier(.2,1.1,.3,1) both}

const fmtDate=s=>s?new Date(s+"T00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"";

function planApply(plan,type,now){
  plan=plan||{};
  let segs=Array.isArray(plan.segs)?plan.segs.map(s=>({type:s.type,end:s.end})):((plan.expiresAt||0)>now&&plan.type&&plan.type!=="none"?[{type:plan.type,end:plan.expiresAt}]:[]);
  segs=segs.filter(s=>s.end>now);
  const addM=(t,n)=>{const d=new Date(t),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.getTime()};
  if(type==="proplus"){
    const idx=segs.length&&segs[0].type==="trial"?1:0;
    if(segs[idx]&&segs[idx].type==="proplus"){const ne=addM(segs[idx].end,12),dl=ne-segs[idx].end;for(let i=idx;i<segs.length;i++)segs[i].end+=dl}
    else{const st=idx?segs[0].end:now,ne=addM(st,12),dl=ne-st;for(let i=idx;i<segs.length;i++)segs[i].end+=dl;segs.splice(idx,0,{type:"proplus",end:ne})}
  }else{
    const m=type==="yearly"?12:1,last=segs[segs.length-1];
    if(!last)segs.push({type,end:addM(now,m)});else if(last.type===type)last.end=addM(last.end,m);else segs.push({type,end:addM(last.end,m)});
  }
  return{type:segs[0].type,expiresAt:segs[segs.length-1].end,segs,paid:true};
}
function planEff(plan,now){
  if(!plan)return{type:"none",expiresAt:0};
  const segs=plan.segs;
  if(!segs||!segs.length)return{type:plan.type||"none",expiresAt:plan.expiresAt||0};
  const s=segs.find(x=>x.end>now);
  if(s)return{type:s.type,expiresAt:s.end};
  const lp=segs.filter(x=>x.type!=="trial").pop()||segs[segs.length-1];
  return{type:lp.type,expiresAt:segs[segs.length-1].end};
}

/* ---------- sandi hapus (PBKDF2) ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function hashPw(pw,saltHex){const salt=saltHex?unhex(saltHex):crypto.getRandomValues(new Uint8Array(16));const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,256);return{salt:hex(salt),hash:hex(bits)}}
async function checkPw(pw){const d=S.P.deletePin;if(!d)return false;return(await hashPw(pw,d.salt)).hash===d.hash}

function rangeFor(k){const e=todayStr();const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return ds(d)};return k==="today"?[e,e]:k==="7d"?[back(6),e]:k==="30d"?[back(29),e]:k==="month"?[e.slice(0,8)+"01",e]:["0000-00-00",e]}

const saldoNow=()=>Number(S.P.openingBalance||0)+S.sales.reduce((a,x)=>a+Number(x.revenue||0),0)-S.expenses.reduce((a,x)=>a+Number(x.amount||0),0)-S.debts.reduce((a,d)=>a+Math.max(0,Number(d.amount||0)-Number(d.paid||0)),0);

function countUp(root){
  $$(".stat .v,.h2v",root).forEach(el=>{const t=el.textContent.trim(),m=t.match(/^(-?)Rp([\d.]+)$/);if(!m)return;const to=Number(m[2].replace(/\./g,""))*(m[1]?-1:1);if(!to)return;const t0=performance.now(),D=800;
    const step=n=>{const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(to*e));if(k<1)requestAnimationFrame(step);else el.textContent=t};requestAnimationFrame(step)})}

function initBanner(){
  const tr=$("#bnTrack");if(!tr)return;const sl=[...tr.children],dots=$$("#bnDots i");let moved=false,down=false,sx=0,sl0=0;
  const cur=()=>{let b=0,bd=1e9;sl.forEach((c,i)=>{const d=Math.abs(c.offsetLeft-tr.scrollLeft-(parseFloat(getComputedStyle(tr).paddingLeft)||0));if(d<bd){bd=d;b=i}});return b};
  const show=i=>{dots.forEach((d,k)=>d.classList.toggle("on",k===i))};
  const to=(i,smooth=true)=>{const pl=parseFloat(getComputedStyle(tr).paddingLeft)||0;tr.style.scrollBehavior=smooth?"smooth":"auto";tr.scrollTo({left:sl[i].offsetLeft-pl});if(!smooth)requestAnimationFrame(()=>tr.style.scrollBehavior="")};
  to(S.bnIdx||0,false);show(S.bnIdx||0);
  tr.onscroll=()=>{const i=cur();S.bnIdx=i;show(i)};
  dots.forEach((d,i)=>d.onclick=()=>to(i));
  tr.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;moved=false;sx=e.clientX;sl0=tr.scrollLeft});
  window.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5){moved=true;tr.classList.add("drag")}if(moved)tr.scrollLeft=sl0-dx});
  window.addEventListener("pointerup",()=>{if(!down)return;down=false;if(moved){tr.classList.remove("drag");to(cur())}});
  tr.addEventListener("click",e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
  clearInterval(S.bnT);S.bnPause=false;
  const pause=()=>{S.bnPause=true;clearTimeout(S.bnR);S.bnR=setTimeout(()=>S.bnPause=false,6000)};
  tr.addEventListener("touchstart",pause,{passive:true});tr.addEventListener("mouseenter",()=>S.bnPause=true);tr.addEventListener("mouseleave",()=>S.bnPause=false);

async function recordSale(p,qty,date,method){
  if(!active())return lockMsg();
  if(p.stock<qty)return toast(`Stok ${p.name} tidak cukup (sisa ${p.stock})`,"bad");
  const data={productId:p.id,name:p.name,cost:p.cost,price:p.price,qty,revenue:p.price*qty,hpp:p.cost*qty,profit:(p.price-p.cost)*qty,date,ts:Date.now(),method};
  const b=writeBatch(db),sref=doc(col("sales"));b.set(sref,data);b.update(doc(col("products"),p.id),{stock:increment(-qty)});logStock(b,p.id,p.name,"jual",-qty,p.stock-qty,`Penjualan ${qty} × ${fmt(p.price)} · ${method}`);
  try{await b.commit()}catch(e){toast("Gagal mencatat: "+e.message,"bad");return null}
  toast(`✔ ${p.name} ×${qty} · Untung ${fmt(data.profit)}`,"ok");
  notify("penjualan","Penjualan dicatat: "+p.name,`${qty} × ${fmt(p.price)} = ${fmt(data.revenue)} · Modal ${fmt(data.hpp)} · Untung ${fmt(data.profit)} · ${fmtDate(date)} ${fmtHM(data.ts)} · ${method}`);
  const ns=p.stock-qty;
  if(ns<=0)notify("stok_habis","Stok habis: "+p.name,"Stok "+p.name+" sekarang 0. Segera restock.");
  else if(ns<=p.minStock)notify("stok_menipis","Stok menipis: "+p.name,`Sisa stok ${ns} (batas minimum ${p.minStock}).`);
  return {id:sref.id,...data};
}

/* notifikasi absen dari aplikasi karyawan (satu kali per kejadian, aman dari duplikat antar-perangkat) */
const attSeen=new Map();let attInit=false;
function attWatch(){
  if(!attInit){S.attendance.forEach(a=>attSeen.set(a.id,a.outAt?2:1));attInit=true;return}
  S.attendance.forEach(a=>{if(!a.byApp)return;const st=a.outAt?2:1,pv=attSeen.get(a.id)||0;if(st<=pv)return;attSeen.set(a.id,st);
    if(pv<1&&st>=1&&Date.now()-a.inAt<10*60000)onceNotif("att-"+a.id+"-in","absensi",`${a.name} absen masuk`,`${hhmm(a.inAt)}${a.late?" · telat "+a.lateMin+" menit":" · tepat waktu"}${a.outside?" · di luar lokasi":""}`);
    if(st===2&&Date.now()-a.outAt<10*60000)onceNotif("att-"+a.id+"-out","absensi",`${a.name} absen pulang`,`${hhmm(a.outAt)}${a.overMin?" · lembur "+a.overMin+" menit":""}${a.earlyMin?" · pulang cepat "+a.earlyMin+" menit":""}`)})}

/* ---------- Hapus transaksi (wajib sandi) ---------- */
function describe(kind,x){
  if(kind==="penjualan")return `Penjualan ${x.name} ×${x.qty} · Jual ${fmt(x.revenue)} · Untung ${fmt(x.profit)} · Tgl ${fmtDate(x.date)} ${fmtHM(x.ts)}`;
  if(kind==="pengeluaran")return `Pengeluaran ${x.category}: ${x.desc} · ${fmt(x.amount)} · Tgl ${fmtDate(x.date)} ${fmtHM(x.ts)}`;
  return `Produk ${x.name} · Modal ${fmt(x.cost)} · Jual ${fmt(x.price)} · Stok ${x.stock}`}
A.del=el=>{
  const kind=el.dataset.kind,id=el.dataset.id,item=(kind==="penjualan"?S.sales:kind==="pengeluaran"?S.expenses:S.products).find(x=>x.id===id);if(!item)return;
  const d=describe(kind,item);
  notify("hapus_percobaan","⚠️ Percobaan penghapusan "+kind,`${d} · Tombol hapus diklik pada ${fmtFull(Date.now())}`,{kind,id});
  if(!S.P.deletePin){modal("Buat sandi hapus dulu",`<p>Untuk melindungi data, penghapusan hanya bisa dilakukan dengan <b>sandi hapus</b> buatan Anda. Buat sandi sekarang, lalu ulangi penghapusan.</p><div class="actions"><button class="btn ghost" data-act="mclose" data-x="1">Nanti</button><button class="btn" data-act="pwCreate">Buat Sandi</button></div>`,{onClose:()=>notify("hapus_batal","Penghapusan dibatalkan",d)});return}
  modal("Verifikasi Sandi Hapus",`<div class="locked" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">🗑️ ${esc(d)}</div><label class="f">Masukkan sandi hapus<input id="dPw" class="in" type="password" autocomplete="off"></label><div class="actions"><button class="btn ghost" data-act="mclose" data-x="1">Batal</button><button class="btn red" data-act="doDel" data-kind="${kind}" data-id="${id}">Hapus Permanen</button></div>`,{onClose:()=>notify("hapus_batal","Penghapusan dibatalkan",d)});
};
A.doDel=async el=>{
  const kind=el.dataset.kind,id=el.dataset.id,item=(kind==="penjualan"?S.sales:kind==="pengeluaran"?S.expenses:S.products).find(x=>x.id===id);if(!item)return closeModal(1);
  const d=describe(kind,item);
  if(Date.now()<S.lockUntil)return toast(`Terkunci. Coba lagi ${Math.ceil((S.lockUntil-Date.now())/1000)} detik lagi.`,"bad");
  const pw=$("#dPw").value;if(!pw)return toast("Masukkan sandi","bad");el.disabled=true;
  if(!(await checkPw(pw))){S.fails++;el.disabled=false;notify("sandi_salah","❌ Sandi hapus salah",`Percobaan ke-${S.fails} pada ${fmtFull(Date.now())}. Target: ${d}`);
    if(S.fails>=5){S.lockUntil=Date.now()+60000;S.fails=0;notify("keamanan","Penghapusan dikunci 60 detik","5 kali salah memasukkan sandi hapus.");toast("5x salah. Penghapusan dikunci 60 detik.","bad")}else toast("Sandi salah","bad");$("#dPw").value="";$("#dPw").focus();return}
  S.fails=0;
  try{
    if(kind==="penjualan"){const b=writeBatch(db);b.delete(doc(col("sales"),id));const p=S.products.find(x=>x.id===item.productId);if(p){b.update(doc(col("products"),p.id),{stock:increment(Number(item.qty))});logStock(b,p.id,p.name,"batal_jual",Number(item.qty),p.stock+Number(item.qty),"Penjualan dihapus (stok dikembalikan)")}if(item.trxId){const rest=S.sales.filter(x=>x.trxId===item.trxId&&x.id!==id);if(!rest.length){b.delete(doc(col("trxs"),item.trxId));S.debts.filter(x=>x.trxId===item.trxId).forEach(x=>b.delete(doc(col("debts"),x.id)))}}await b.commit()}
    else await deleteDoc(doc(col(kind==="pengeluaran"?"expenses":"products"),id));
  }catch(e){el.disabled=false;return toast("Gagal menghapus: "+e.message,"bad")}
  closeModal(1);toast("Data dihapus","ok");
  {const k=kind==="penjualan"?"sales":kind==="pengeluaran"?"expenses":"products";S[k]=S[k].filter(x=>x.id!==id);if(kind==="penjualan"&&item.trxId&&!S.sales.some(x=>x.trxId===item.trxId)){S.trxs=S.trxs.filter(x=>x.id!==item.trxId);S.debts=S.debts.filter(x=>x.trxId!==item.trxId)}clearTimeout(S.enterT);$("#main")?.classList.remove("enter");refreshChrome();renderPage(true)}
  notify("hapus_transaksi","🗑️ "+kind[0].toUpperCase()+kind.slice(1)+" dihapus",`${d} · Dihapus ${fmtFull(Date.now())} dengan sandi terverifikasi${kind==="penjualan"&&S.products.find(x=>x.id===item.productId)?` · Stok dikembalikan +${item.qty}`:""}`);
};

Object.keys(WIPE_PAGE).forEach(pn=>{const pg=PAGES[pn];if(!pg)return;const h=pg.html;pg.html=function(){const out=h.call(this);const k=WIPE_PAGE[pn];if(["pelanggan","kasbon","absensi"].includes(pn)&&!isPro())return out;const W=WIPE[k];if(!W||!W.n())return out;return `<div class="row" style="justify-content:flex-end;margin-bottom:10px"><button class="btn red sm" data-act="wipe" data-w="${k}">🗑 Hapus Semua ${W.label} (${W.n()})</button></div>`+out}});
async function wipeCols(cols){let n=0;for(const c of cols){const sn=await getDocs(col(c));const ds=sn.docs;for(let i=0;i<ds.length;i+=400){const b=writeBatch(db);ds.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit();n+=Math.min(400,ds.length-i)}}return n}
async function restockFromSales(){const m={};S.sales.forEach(x=>{if(x.productId)m[x.productId]=(m[x.productId]||0)+Number(x.qty||0)});const ids=Object.keys(m).filter(id=>S.products.some(p=>p.id===id)&&m[id]);for(let i=0;i<ids.length;i+=400){const b=writeBatch(db);ids.slice(i,i+400).forEach(id=>b.update(doc(col("products"),id),{stock:increment(m[id])}));await b.commit()}}
async function gatePw(el,d){

    if(S.fails>=5){S.lockUntil=Date.now()+60000;S.fails=0;notify("keamanan","Penghapusan dikunci 60 detik","5 kali salah memasukkan sandi hapus.");toast("5x salah. Penghapusan dikunci 60 detik.","bad")}else toast("Sandi salah","bad");$("#dPw").value="";$("#dPw").focus();return false}

A.doWipe=async el=>{

/* ---------- Ekspor: Excel (ExcelJS), CSV, PNG ---------- */
const XF={date:"dd/mm/yyyy",time:"hh:mm",int:"#,##0",rp:'"Rp" #,##0;[Red]-"Rp" #,##0',pct:"0.0%"};
const xlDate=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const xlTime=ts=>{const d=new Date(ts);return (d.getHours()*60+d.getMinutes())/1440};
const perTxt=d=>d.f==="0000-00-00"?"Semua waktu":fmtDate(d.f)+" s/d "+fmtDate(d.t);
const isoRe=/^\d{4}-\d{2}-\d{2}$/;
/* spec: {name,title,sub:[...],cols:[{h,w,f,sum}],rows:[[...]]} ; kolom f: txt|date|time|int|rp|pct ; sel date = "YYYY-MM-DD", time = timestamp */
function autoSpec(name,rows){const head=rows[0]||[],body=rows.slice(1);
  const cols=head.map((h,i)=>{const v=body.map(r=>r[i]).filter(x=>x!==""&&x!=null);const f=v.length&&v.every(x=>isoRe.test(String(x)))?"date":v.length&&v.every(x=>typeof x==="number")?"int":"txt";return{h,f}});
  return{name,title:name,cols,rows:body}}
function xlSheet(wb,sp,idx){
  const ws=wb.addWorksheet(sp.name.slice(0,31),{views:[{state:"frozen",ySplit:3+(sp.sub?.length||0),showGridLines:false}]});
  const n=sp.cols.length,hr=4+(sp.sub?.length||0)-1+0; // baris header
  const head=(sp.sub?.length||0)+3;
  ws.getCell(1,1).value=sp.title;ws.getCell(1,1).font={bold:true,size:15,color:{argb:"FF0B3A8C"}};
  (sp.sub||[]).forEach((t,i)=>{ws.getCell(2+i,1).value=t;ws.getCell(2+i,1).font={size:10,color:{argb:"FF5B6577"}}});
  const hasSum=sp.cols.some(c=>c.sum);
  const rows=sp.rows.map(r=>sp.cols.map((c,i)=>{const v=r[i];if(v===""||v==null)return null;if(c.f==="date")return isoRe.test(v)?xlDate(v):v;if(c.f==="time")return xlTime(v);return v}));
  ws.addTable({name:"Tbl"+(idx+1),ref:"A"+head,headerRow:true,totalsRow:false,style:{theme:"TableStyleMedium2",showRowStripes:true},
    columns:sp.cols.map((c,i)=>({name:String(c.h),filterButton:true})),
    rows:rows.length?rows:[sp.cols.map(()=>null)]});
  sp.cols.forEach((c,i)=>{const col=ws.getColumn(i+1);
    const maxLen=Math.max(String(c.h).length+3,...sp.rows.slice(0,400).map(r=>{const v=r[i];return c.f==="rp"?String(Math.round(Math.abs(Number(v)||0))).length+6:c.f==="date"?12:c.f==="time"?8:c.f==="pct"?8:String(v??"").length+2}));
    col.width=Math.min(c.w||46,Math.max(c.f==="date"?13:9,maxLen));
    const nf=XF[c.f];const nr=Math.max(rows.length,1),last=head+nr+(hasSum?1:0),L=ws.getColumn(i+1).letter;
    for(let r=head+1;r<=last;r++){const cell=ws.getCell(r,i+1);if(nf)cell.numFmt=nf;cell.alignment={vertical:"middle",horizontal:["rp","int","pct"].includes(c.f)?"right":c.f==="date"||c.f==="time"?"center":"left",wrapText:c.f==="txt"&&(c.w||0)>=30};if(hasSum&&r===last){cell.font={bold:true};cell.border={top:{style:"medium",color:{argb:"FF0B5ED7"}}};cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE6EEFC"}};if(i===0)cell.value="TOTAL";else if(c.sum)cell.value={formula:`SUBTOTAL(109,${L}${head+1}:${L}${head+nr})`,result:rows.reduce((a,x)=>a+(Number(x[i])||0),0)}}}
    const hc=ws.getCell(head,i+1);hc.font={bold:true,color:{argb:"FFFFFFFF"}};hc.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF0B5ED7"}};hc.alignment={vertical:"middle",horizontal:"center",wrapText:true}});
  ws.getRow(head).height=24;
  ws.pageSetup={orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0};
  return ws}
/* blok bergaya biasa (tanpa tabel) untuk lembar Ringkasan */
function xlBlock(ws,r,title,heads,rows,fmts,color){
  const c0=ws.getCell(r,1);c0.value=title;c0.font={bold:true,size:12,color:{argb:color||"FF0B3A8C"}};r++;
  heads.forEach((h,i)=>{const c=ws.getCell(r,i+1);c.value=h;c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:color||"FF0B5ED7"}};c.alignment={horizontal:i?"right":"left",vertical:"middle"}});r++;
  rows.forEach((row,k)=>{row.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;if(fmts[i])c.numFmt=XF[fmts[i]];c.alignment={horizontal:i?"right":"left"};c.border={bottom:{style:"hair",color:{argb:"FFB8C2D6"}}};if(k%2)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF2F6FD"}}});r++});
  return r+1}
async function xlsx(sheets,name,extra){
  if(!window.ExcelJS){toast("Pustaka Excel belum termuat, coba lagi sebentar","bad");return false}
  const wb=new ExcelJS.Workbook();wb.creator="WebKasir Kita";wb.created=new Date();
  if(extra&&extra.summary)extra.summary(wb);

  sheets.forEach(sh=>{const sp=Array.isArray(sh)?autoSpec(sh[0],sh[1]):sh;if(Array.isArray(sh))sp.sub=[base,"Dicetak "+fmtFull(Date.now())];xlSheet(wb,sp,k++)});
  const buf=await wb.xlsx.writeBuffer();
  dl(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),name);toast("Excel diunduh","ok");return true}

function reportAgg(d){
  const sales=d.sales,exp=d.exp,s=calc(sales,exp);
  const bySort=(o,key)=>Object.values(o).sort((a,b)=>b[key]-a[key]);
  const prod={},day={},met={},cat={};
  sales.forEach(x=>{const p=prod[x.name]||(prod[x.name]={name:x.name,qty:0,rev:0,hpp:0,profit:0,disc:0});p.qty+=Number(x.qty);p.rev+=Number(x.revenue);p.hpp+=Number(x.hpp);p.profit+=Number(x.profit);p.disc+=Number(x.discount||0);
    const dd=day[x.date]||(day[x.date]={date:x.date,trx:new Set(),qty:0,rev:0,hpp:0,profit:0,exp:0});dd.trx.add(x.trxId||x.id);dd.qty+=Number(x.qty);dd.rev+=Number(x.revenue);dd.hpp+=Number(x.hpp);dd.profit+=Number(x.profit);
    const m=x.method||"Tunai",mm=met[m]||(met[m]={name:m,trx:new Set(),rev:0});mm.trx.add(x.trxId||x.id);mm.rev+=Number(x.revenue)});
  exp.forEach(x=>{const dd=day[x.date]||(day[x.date]={date:x.date,trx:new Set(),qty:0,rev:0,hpp:0,profit:0,exp:0});dd.exp+=Number(x.amount);
    const c=cat[x.category]||(cat[x.category]={name:x.category||"Lainnya",n:0,amt:0});c.n++;c.amt+=Number(x.amount)});
  return{s,prod:bySort(prod,"rev"),day:Object.values(day).sort((a,b)=>a.date.localeCompare(b.date)),met:bySort(met,"rev"),cat:bySort(cat,"amt"),
    trxCount:new Set(sales.map(x=>x.trxId||x.id)).size}}
const catOf=x=>{const p=S.products.find(q=>q.id===x.productId);return p?p.category||"":""};

let snapLoading=null;
function loadSnap(){

    sc.setAttribute("data-client-key",CONFIG.MIDTRANS_CLIENT_KEY);
    sc.onload=()=>res();
    sc.onerror=()=>{snapLoading=null;rej(new Error("Gagal memuat jendela pembayaran Midtrans. Matikan AdBlock lalu coba lagi."))};
    document.head.appendChild(sc)});

async function api(path,body){

  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||("Server error "+r.status));return j}

function payPoll(orderId){clearInterval(payTimer);let n=0;

function receiptTrx(t){
  const W=S.P.paper==="80"?48:32,c=s=>" ".repeat(Math.max(0,Math.floor((W-s.length)/2)))+s;
  const lr=(l,r)=>{l=String(l);r=String(r);const sp=W-l.length-r.length;return sp>0?l+" ".repeat(sp)+r:l.slice(0,Math.max(1,W-r.length-1))+" "+r};
  const L=[],hr="-".repeat(W),d=new Date(t.ts);
  wrapTxt(S.P.businessName||"Toko",W).forEach(x=>L.push(c(x)));
  if(S.P.branchName)wrapTxt(S.P.branchName,W).forEach(x=>L.push(c(x)));
  if(S.P.address)wrapTxt(S.P.address,W).forEach(x=>L.push(c(x)));
  if(S.P.phone)L.push(c("Telp "+S.P.phone));
  L.push(hr);L.push(lr("No",t.no));L.push(lr("Tanggal",d.toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}).replace(".",":")));
  if(S.P.rcCashier!==false&&t.cashier)L.push(lr("Kasir",t.cashier));if(t.customerName)L.push(lr("Pelanggan",t.customerName));
  L.push(hr);let q=0;
  (t.items||[]).forEach(x=>{wrapTxt(x.name+(x.ws?" (grosir)":""),W).forEach(s=>L.push(s));L.push(lr(`${x.qty} x ${nf(x.price)}`,nf(x.sub)));q+=x.qty});
  L.push(hr);L.push(lr("Subtotal ("+q+" item)",nf(t.subtotal)));if(t.discount)L.push(lr("Diskon","-"+nf(t.discount)));L.push(lr("TOTAL",nf(t.total)));L.push(hr);
  if(t.method==="Kasbon"){if(t.dp)L.push(lr("Uang muka",nf(t.dp)));L.push(lr("Sisa kasbon",nf(t.debt)));if(t.due)L.push(lr("Jatuh tempo",fmtDate(t.due)))}
  else{L.push(lr("Bayar ("+t.method+")",nf(t.paid)));if(t.method==="Tunai")L.push(lr("Kembali",nf(t.change)))}
  L.push(hr);wrapTxt(S.P.footer||"Terima kasih atas kunjungan Anda",W).forEach(x=>L.push(c(x)));
  return asciiOnly(L.join("\n"))}

async function logoBytes(){
  if(!rcLogoOn())return null;
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=S.P.photo});
    const w=S.P.paper==="80"?240:176,h=Math.max(8,Math.round(img.height*w/img.width)),cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    const px=x.getImageData(0,0,w,h).data,bw=Math.ceil(w/8),out=[0x1b,0x61,0x01,0x1d,0x76,0x30,0x00,bw&255,bw>>8,h&255,h>>8];
    for(let r=0;r<h;r++)for(let bx=0;bx<bw;bx++){let v=0;for(let k=0;k<8;k++){const cx=bx*8+k;if(cx<w){const i=(r*w+cx)*4,lum=.3*px[i]+.59*px[i+1]+.11*px[i+2];if(lum<140)v|=0x80>>k}}out.push(v)}
    out.push(0x0a,0x1b,0x61,0x00);return new Uint8Array(out)}catch(e){return null}}

async function startTour(){S.tour=true;let i=0;const root=$("#tourRoot");
  const end=async()=>{root.innerHTML="";S.tour=false;S.endTour=null;if(!S.P.tourDone){await updateDoc(doc(db,"users",uid()),{tourDone:true}).catch(()=>{});notify("info","Tutorial selesai","Anda bisa mengulang tutorial dari menu Pengaturan.")}};
  S.endTour=end;
  const show=async()=>{try{await step()}catch(e){console.warn("tour",e);end()}};
  const step=async()=>{const st=TOUR[i];if(st.page&&S.page!==st.page){go(st.page);await sleep(250)}
    let el=st.sel?$(st.sel):null;
    if(el&&el.closest(".side")){if(isMobile()){$("#side").classList.add("open");$("#backdrop").classList.add("open")}}else if(isMobile()){$("#side")?.classList.remove("open");$("#backdrop")?.classList.remove("open")}
    if(el&&!el.closest(".side")&&!el.closest(".top"))el.scrollIntoView({block:"center"});await sleep(260);
    const r=el&&!st.center?el.getBoundingClientRect():null,last=i===TOUR.length-1;
    root.innerHTML=`<div class="tblock"></div><div class="thole" id="th"></div><div class="tpop" id="tp"><h4>${st.title}</h4><p>${st.text}</p><div class="tdots">${TOUR.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div><div class="row between"><button class="btn ghost sm" id="tSkip">${last?"":"Lewati"}</button><div class="row gap">${i>0?'<button class="btn ghost sm" id="tPrev">Kembali</button>':""}<button class="btn sm" id="tNext">${last?"Mulai":"Lanjut"}</button></div></div></div>`;
    const th=$("#th"),tp=$("#tp");
    if(r){const p=6;Object.assign(th.style,{left:r.left-p+"px",top:r.top-p+"px",width:r.width+p*2+"px",height:r.height+p*2+"px"})}else Object.assign(th.style,{left:innerWidth/2+"px",top:innerHeight/2+"px",width:"0px",height:"0px"});
    const ph=tp.offsetHeight,pw=tp.offsetWidth;let x,y;
    if(r){x=Math.min(Math.max(12,r.left),innerWidth-pw-12);if(r.bottom+ph+20<innerHeight)y=r.bottom+16;else if(r.top-ph-20>0)y=r.top-ph-16;else{y=innerHeight-ph-14;x=Math.min(Math.max(12,innerWidth-pw-14),innerWidth-pw-12)}}
    else{x=(innerWidth-pw)/2;y=(innerHeight-ph)/2}
    tp.style.left=x+"px";tp.style.top=Math.min(Math.max(10,y),Math.max(10,innerHeight-ph-10))+"px";
    $("#tNext").onclick=()=>{if(last)return end();i++;show()};const pv=$("#tPrev");if(pv)pv.onclick=()=>{i--;show()};const sk=$("#tSkip");if(sk)sk.onclick=end;
  };show()}

/* ---- navigasi lewat tombol back/forward browser ---- */
addEventListener("hashchange",()=>{if(!S.P||!$("#main"))return;const h=location.hash.replace("#/","");if(h&&h!==S.page&&(NAV.some(n=>n[0]===h)||(h==="admin"&&isAdmin()))){S.page=h;renderPage(true)}});
</script>
